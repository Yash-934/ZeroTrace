[package]
name = "zerotrace_core"
version = "2.0.0"
edition = "2021"
rust-version = "1.79"
description = "ZeroTrace Messenger 2.0 Post-Quantum Hybrid Cryptographic & Tor Onion Service Security Core"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "zerotrace_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["jni-bridge"]
jni-bridge = ["dep:jni"]
arti-tor = ["dep:arti-client", "dep:tor-hsservice", "dep:tor-rtcompat", "dep:tokio"]

[dependencies]
# Standardized Post-Quantum Cryptography (NIST FIPS 203 & FIPS 204)
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-1024", "std", "zeroize"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-87", "std", "zeroize"] }

# Classical Elliptic-Curve Cryptography (RFC 7748 & RFC 8032)
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize", "alloc"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["rand_core", "zeroize", "alloc", "fast"] }

# Symmetric AEAD, Key Derivation, and Hashing
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "zeroize"] }
hkdf = { version = "=0.12.4", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.8", default-features = false }
subtle = { version = "=2.6.1", default-features = false }

# OS CSPRNG & Volatile Memory Zeroization
rand_core = { version = "=0.6.4", features = ["getrandom"] }
getrandom = { version = "=0.2.15", features = ["std"] }
zeroize = { version = "=1.8.1", features = ["alloc", "zeroize_derive"] }
libc = { version = "=0.2.168", default-features = false }

# Deterministic Serialization & Encoding
serde = { version = "=1.0.215", features = ["derive"] }
bincode = "=1.3.3"
hex = "=0.4.3"
base64 = "=0.22.1"
thiserror = "=2.0.3"

# Android JNI Bridge
jni = { version = "=0.21.1", optional = true }

# Official Rust Tor Implementation (Arti + Onion Service v3)
tokio = { version = "=1.41.1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"], optional = true }
arti-client = { version = "=0.25.0", features = ["onion-service-client", "onion-service-service", "tokio", "rustls"], optional = true }
tor-hsservice = { version = "=0.25.0", optional = true }
tor-rtcompat = { version = "=0.25.0", features = ["tokio", "rustls"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
